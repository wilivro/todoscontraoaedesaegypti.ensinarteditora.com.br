  <script>
    const lightbox = GLightbox({

  </script>
  <script>
    document.querySelectorAll('.galeria-categoria').forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
  
        const target = this.dataset.target;
  
        /* 1️⃣ remove active de todas */
        document.querySelectorAll('.galeria-categoria').forEach(el => {
          el.classList.remove('active');
        });
  
        /* 2️⃣ adiciona active na clicada */
        this.classList.add('active');
  
        /* 3️⃣ esconde todas as galerias */
        document.querySelectorAll('.galeria-section').forEach(sec => {
          sec.classList.add('d-none');
        });
  
        /* 4️⃣ mostra a galeria correta */
        const section = document.getElementById(target);
        section.classList.remove('d-none');
  
        /* 5️⃣ scroll suave */
        window.scrollTo({
          top: section.offsetTop - 120,
          behavior: 'smooth'
        });
      });
    });
  </script>
